# 电力交易数据源完整配置
# 覆盖：国家政策 / 区域监管 / 省级交易中心 / 行业资讯 / 公共数据
# 用法：爬虫按此配置多源采集，按 type + province 分类沉淀到知识库

sources:
  # ============ 一、国家级政策源（最高权威）============
  - key: ndrc
    name: 国家发展和改革委员会
    url: http://www.ndrc.gov.cn
    section_urls:
      - https://www.ndrc.gov.cn/xxgk/zcfb/tz/        # 通知文件
      - https://www.ndrc.gov.cn/xxgk/zcfb/fzggwl/     # 发展规划
    type: national_policy
    grid: null
    crawl: list_detail            # 列表页→详情页
    keywords: [电力, 市场, 电价, 能源, 交易, 现货, 储能, 绿电]

  - key: nea
    name: 国家能源局
    url: http://www.nea.gov.cn
    section_urls:
      - https://www.nea.gov.cn/zwfw/zcfg/             # 政策法规
      - https://www.nea.gov.cn/xxgk/                  # 信息公开
    type: national_policy
    crawl: list_detail
    keywords: [电力, 市场, 交易, 辅助服务, 安全, 储能, 新能源]

  - key: gov_cn
    name: 中国政府网(国务院)
    url: https://www.gov.cn
    section_urls:
      - https://www.gov.cn/zhengce/zhengceku/         # 政策库
    type: national_policy
    crawl: list_detail
    keywords: [电力, 能源, 市场, 国民经济, 发展规划]

  - key: epta
    name: 中电联人才测评中心
    url: https://www.epta.org.cn
    section_urls:
      - https://www.epta.org.cn/home                   # 考试通知
    type: exam_info               # 考试报名/通知
    crawl: list_detail
    keywords: [电力交易员, 考试, 报名, 鉴定, 职业技能]

  # ============ 二、区域能源监管局（分片区）============
  - key: nea_huabei
    name: 国家能源局华北监管局
    url: http://hbj.nea.gov.cn
    section_urls: [http://hbj.nea.gov.cn]
    type: regulation
    region: 华北                  # 京/津/冀/晋/蒙西/鲁
    crawl: list_detail
    keywords: [电力, 市场, 交易, 规则, 监管]

  - key: nea_dongbei
    name: 国家能源局东北监管局
    url: http://dbj.nea.gov.cn
    type: regulation
    region: 东北                  # 辽/吉/黑/蒙东
    crawl: list_detail
    keywords: [电力, 市场, 交易]

  - key: nea_xibei
    name: 国家能源局西北监管局
    url: http://xbj.nea.gov.cn
    type: regulation
    region: 西北                  # 陕/甘/青/宁/新
    crawl: list_detail
    keywords: [电力, 市场, 交易]

  - key: nea_nanfang
    name: 国家能源局南方监管局
    url: http://nfj.nea.gov.cn
    type: regulation
    region: 南方                  # 粤/桂/滇/黔/琼
    crawl: list_detail
    keywords: [电力, 市场, 交易, 南方电网]

  - key: nea_huadong
    name: 国家能源局华东监管局
    url: http://hdb.nea.gov.cn
    type: regulation
    region: 华东                  # 沪/苏/浙/皖/闽
    crawl: list_detail
    keywords: [电力, 市场, 交易]

  - key: nea_huazhong
    name: 国家能源局华中监管局
    url: http://hzj.nea.gov.cn
    type: regulation
    region: 华中                  # 鄂/湘/豫/赣/川/渝
    crawl: list_detail
    keywords: [电力, 市场, 交易]

  # ============ 三、省级电力交易中心（信息公开）============
  # 说明：省级电力交易中心运营平台（如 pmos.*.sgcc.com.cn、pm.gd.csg.cn 等）
  #   属受保护的信息系统，其市场经营数据应通过官方开放平台 API（各中心发布的
  #   《数据接口接入指南》）以合规主体身份接入获取，本项目不实现对其的抓取。
  #   本项目仅采集交易中心面向社会公开的信息披露/公告页面（见 exchange_center
  #   适配器中的 EXCHANGE_SOURCES：广州 www.gzpec.cn、北京 www.bjpx.com.cn）。
  #   下列 pmos_*/csg_gd 条目仅为占位说明，未接入任何适配器，不参与实际抓取。

  # ============ 四、行业资讯与研究（学习素材）============
  - key: cec
    name: 中国电力企业联合会
    url: https://www.cec.org.cn
    section_urls: [https://www.cec.org.cn]
    type: industry_news
    crawl: list_detail
    keywords: [电力, 市场, 统计, 报告, 标准]

  - key: csg
    name: 南方电网公司
    url: https://www.csg.cn
    type: industry_news
    crawl: list_detail
    keywords: [电力, 交易, 西电东送]

  # ============ 五、公共数据（结构化时序数据）============
  - key: nea_statistics
    name: 国家能源局公开统计
    url: https://www.nea.gov.cn/xwfb/index.htm
    type: public_data
    data_fields: [power_consumption, market_transaction, installed_capacity, utilization_hours, green_certificate, new_energy_projects]
    crawl: list_detail_incremental
    schedule: daily
    provenance_level: observed_public

  - key: gzpec_market
    name: 广州电力交易中心公开行情
    url: http://www.gzpec.cn/news/scyj/
    type: public_data
    data_fields: [period, province, market_stage, avg_price, avg_volume, green_certificate_price]
    crawl: list_detail_incremental
    schedule: daily
    provenance_level: observed_public

  - key: cneeex_carbon
    name: 上海环境能源交易所全国碳市场
    url: https://overview.cneeex.com/qgtpfqjy/mrgk/
    type: public_data
    data_fields: [date, open, high, low, close, volume, turnover]
    crawl: list_detail_incremental
    schedule: daily
    provenance_level: observed_public
    rights_note: 展示或转载须注明上海环境能源交易所并遵守原文声明

  - key: nbs_energy
    name: 国家统计局月度能源生产
    url: https://www.stats.gov.cn/sj/zxfb/
    type: public_data
    data_fields: [month, coal, crude_oil, natural_gas, power_generation, generation_mix_yoy]
    crawl: list_detail_incremental
    schedule: daily
    provenance_level: observed_public

  - key: clearing_data
    name: 各省出清价格数据
    type: public_data             # 结构化数据(价格/负荷/出力)
    data_fields: [date, province, product, clearing_price, load, renewable_output]
    crawl: api                    # 走API接口
    schedule: hourly              # 每小时更新

  - key: coal_price
    name: 动力煤价格指数
    type: public_data
    data_fields: [date, coal_type, price, port]
    crawl: api
    schedule: daily

  - key: carbon_price
    name: 全国碳市场价格
    type: public_data
    data_fields: [date, product, open, close, volume]
    crawl: api
    schedule: daily

# ============ 分类体系 ============
categories:
  national_policy: 国家政策        # 发改委/能源局/国务院
  regulation: 监管规则             # 区域监管局
  exchange_info: 交易中心公告      # 省级交易中心
  industry_news: 行业资讯          # 中电联/南网/行业
  exam_info: 考试信息             # 中电联测评中心
  public_data: 公共数据            # 出清价/煤价/碳价

# ============ 沉淀策略 ============
sediment:
  # 政策/规则/公告 → 知识库文档(可检索)
  docs: [national_policy, regulation, exchange_info, industry_news, exam_info]
  # 结构化数据 → 数据市场(时序分析)
  data: [public_data]
  # 知识库自动关联：政策→知识点→题目
  auto_link: true
